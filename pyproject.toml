[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molecule-ai"
version = "0.1.0"
description = "Molecule AI — research and historical backtesting for crypto and prediction markets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "polars>=1.6.0",
  "duckdb>=1.1.0",
  "pyarrow>=17.0.0",
  "sqlalchemy>=2.0.32",
  "psycopg2-binary>=2.9.9",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["engine*", "data*", "agents*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
